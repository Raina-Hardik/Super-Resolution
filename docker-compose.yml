version: '3.8'

services:
  super-resolution:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: super-resolution-app
    volumes:
      - ./uploads:/app/uploads
      - ./output:/app/output
      - ./weights:/app/weights
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - super-resolution-network

  caddy:
    image: caddy:2-alpine
    container_name: super-resolution-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-super-res.local}
    depends_on:
      - super-resolution
    restart: unless-stopped
    networks:
      - super-resolution-network

networks:
  super-resolution-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
