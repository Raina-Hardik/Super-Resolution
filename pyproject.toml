[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "super-resolution"
version = "2.0.0"
description = "Image Super-Resolution with EDSR using FastAPI"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
authors = [
    {name = "Raina-Hardik", email = "hardikraina079@gmail.com"},
]
keywords = ["super-resolution", "image-processing", "deep-learning", "fastapi", "edsr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
    "fastapi>=0.127.0",
    "uvicorn[standard]>=0.40.0",
    "python-multipart>=0.0.21",
    "pydantic-settings>=2.0.0",
    "jinja2>=3.1.6",
    "pillow>=12.0.0",
    "opencv-python>=4.12.0.88",
    "imageio>=2.37.2",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
    "albumentations>=1.4.20",
    "numpy>=2.4.0",
    "scipy>=1.16.3",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.8.0",
    "pyyaml>=6.0.3",
    "tqdm>=4.67.1",
    "scalar-fastapi>=1.0.3",
    "celery>=5.4.0",
    "redis>=5.0.0",
    "structlog>=24.0.0",
    "pyjwt>=2.8.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.1",
    "black>=25.12.0",
    "flake8>=7.3.0",
    "mypy>=1.19.1",
    "isort>=7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["api", "core", "models", "utils"]

[project.urls]
Homepage = "https://github.com/Raina-Hardik/Super-Resolution"
Repository = "https://github.com/Raina-Hardik/Super-Resolution"
Issues = "https://github.com/Raina-Hardik/Super-Resolution/issues"
Documentation = "https://github.com/Raina-Hardik/Super-Resolution#readme"

[project.scripts]
super-resolution = "api.main:app"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.1",
    "black>=25.12.0",
    "flake8>=7.3.0",
    "mypy>=1.19.1",
    "isort>=7.0.0",
]

[tool.black]
line-length = 127
target-version = ["py314", "py315"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 127
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "albumentations.*",
    "cv2.*",
    "scipy.*",
    "sklearn.*",
    "imageio.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/env/*",
    "*/.venv/*",
    "temp.py",
]

[tool.coverage.report]
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 127
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
